$kind: http-request
url: "{{baseUrl}}/games"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{customerToken}}
body:
  type: json
  content: |-
    {
      "title": "Forbidden Game",
      "rating": "E",
      "platform": "PC",
      "genre": "Puzzle"
    }
scripts:
  - type: afterResponse
    code: pm.test('Customer cannot create games', function () { pm.response.to.have.status(403); });
    language: text/javascript
order: 7000
