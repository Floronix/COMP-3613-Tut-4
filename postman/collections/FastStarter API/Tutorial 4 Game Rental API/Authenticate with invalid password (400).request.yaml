$kind: http-request
url: "{{baseUrl}}/auth"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "{{customerUsername}}",
      "password": "incorrect-password"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Invalid credentials are rejected', function () { pm.response.to.have.status(400); });
      pm.test('Error reports invalid credentials', function () { pm.expect(pm.response.json().detail).to.eql('Invalid username or password'); });
    language: text/javascript
order: 4000
